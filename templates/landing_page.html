<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harshiv’s Big Back Meal Scanner</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="hero">
    <div class="overlay"></div>
    <h1 class="hero-title">Feed The Big Back 🍽️</h1>
    <p class="hero-sub">Upload a meal photo & discover what this menace eats</p>
  </div>

  <div class="wrapper">
    <div class="card glass">
      <h2 class="card-title">Choose a Photo</h2>
      <p class="sub">Upload a food image — AI will analyze it.</p>

      <button class="primary-btn" id="preference_button" onclick="choose_photo()">
        Upload Meal Photo
      </button>

      <input type="file" id="imageInput" accept="image/*" style="display:none">

      <div id="result" class="result"></div>

      <form id="uploadForm" action="/predict" method="POST" enctype="multipart/form-data">
        <input type="file" accept="image/*" capture="camera" id="cameraInput" name="image" style="display:none;">
        <input type="file" accept="image/*" id="fileInput" name="image" style="display:none;">
      </form>
    </div>

    <div class="food-grid">
      <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836" />
      <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd" />
      <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836" />
      <img src="https://images.unsplash.com/photo-1490645935967-10de6ba17061" />
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
